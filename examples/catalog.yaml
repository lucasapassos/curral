# Everything here is mounted once at startup, before the instance is locked.
# String values may reference environment variables: ${VAR} or ${VAR:-default}.
# A missing variable without a default aborts startup.

# INSTALL + LOAD at boot. Autoloading is disabled afterwards, so list every
# extension a query may need (e.g. httpfs, iceberg, postgres, json).
extensions: []

# Extra global settings (SET GLOBAL key = value).
settings: {}

# CREATE OR REPLACE SECRET name (TYPE type, KEY value, ...).
secrets: []

# ATTACH 'path' AS name (KEY value, ...). Options are passed through as-is,
# so any ATTACH-capable source works.
databases:
  - name: sales
    path: ${CURRAL_DATA:-./data}/sales.duckdb
  - name: logs
    path: ${CURRAL_DATA:-./data}/logs.duckdb
    options: { READ_ONLY: true }

# Catalog used for unqualified names (USE). Defaults to the first database.
default: sales

# Escape hatch: SQL run after the ATTACHes and before lockdown.
init_sql: []

