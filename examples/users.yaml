# Generate hashes with: curral hash-password
# Example passwords: admin-pw, analyst-pw, etl-pw (do not use outside local tests).
# Example API key (local tests only): curral_XICI32AYJPBF3NO24LOFD75YEEGCMVJ6ZSRLZ2G2NDHF77VSRRVA
users:
  - name: admin
    password_hash: "$2a$10$rNoKnQq.3DpMThFMWCWrV.K5gnqR/KpayqeDRFmiYtXMJzIUJrgTC"
    roles: [admin]
  - name: analyst
    password_hash: "$2a$10$1dh.neV/AE968ov/MbQLxujg0QMqiOZHFvUipvpldEXNBzpD4ID3K"
    roles: [analyst]
  - name: etl
    password_hash: "$2a$10$bdAmoqFBIWf8pxbPhwQIj.Khrgcq4YPIhmNngGBHOHpCru4kkDHZO"
    roles: [etl]

# Service credentials: "Authorization: Bearer curral_...". Generate with
# curral gen-api-key NAME ROLES...; only the SHA-256 is stored here.
api_keys:
  - name: etl-job
    key_sha256: "49e4c3b903ad51d4840cd5a065be4d2c0e967f0ff088fcd1ac9769369d5d01d9"
    roles: [etl]
    # expires: 2027-12-31

# Roles for OIDC users (e.g. Google, whose tokens carry no roles), matched on
# --oidc-user-claim: an exact value or a whole e-mail domain. Added to any
# roles the token itself carries. Unmatched users get no roles from here.
# identities:
#   - match: ana@gmail.com
#     roles: [analyst]
#   - match: "*@example.com"
#     roles: [analyst]
