name: release

# Push a tag like v0.1.0 to publish: tests, linux amd64/arm64 binaries,
# a multi-arch image on Docker Hub and a GitHub release with notes from
# CHANGELOG.md.
#
# Needs the secret DOCKERHUB_TOKEN (a Docker Hub access token with Read &
# Write) in the "release" environment, which only v* tags can deploy to, and,
# if the namespace is not lucasapassos, the repository variable
# DOCKERHUB_USERNAME.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || 'lucasapassos' }}
  IMAGE: docker.io/${{ vars.DOCKERHUB_USERNAME || 'lucasapassos' }}/curral

jobs:
  test:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: check Docker Hub credentials
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: test -n "$DOCKERHUB_TOKEN" || { echo "::error::secret DOCKERHUB_TOKEN is not set in the release environment"; exit 1; }
      - run: go vet -tags duckdb_arrow ./... && go test -count=1 -tags duckdb_arrow ./...

  binaries:
    needs: test
    strategy:
      matrix:
        include:
          # 22.04 (glibc 2.35) so the binaries also run on older distributions.
          - { runner: ubuntu-22.04, os: linux, arch: amd64, ext: "", archive: tar.gz }
          - { runner: ubuntu-22.04-arm, os: linux, arch: arm64, ext: "", archive: tar.gz }
          - { runner: macos-14, os: darwin, arch: arm64, ext: "", archive: tar.gz }
          - { runner: windows-latest, os: windows, arch: amd64, ext: ".exe", archive: zip }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: build
        shell: bash
        run: |
          name=curral_${GITHUB_REF_NAME}_${{ matrix.os }}_${{ matrix.arch }}
          bin=dist/$name/curral${{ matrix.ext }}
          mkdir -p dist/$name
          CGO_ENABLED=1 go build -trimpath -tags duckdb_arrow \
            -ldflags "-s -w -X main.version=${GITHUB_REF_NAME} -X main.commit=${GITHUB_SHA}" \
            -o "$bin" ./cmd/curral
          "$bin" version
          "$bin" install-extensions --extension-dir dist/$name/extensions httpfs avro iceberg
          cp README.md CHANGELOG.md LICENSE dist/$name/
          cp -r examples dist/$name/
          if [ "${{ matrix.archive }}" = "zip" ]; then
            (cd dist && 7z a -tzip "$name.zip" "$name")
          else
            tar -C dist -czf "dist/$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*.${{ matrix.archive }}

  image:
    needs: test
    environment: release
    strategy:
      matrix:
        include:
          - { runner: ubuntu-latest, platform: linux/amd64, arch: amd64 }
          - { runner: ubuntu-24.04-arm, platform: linux/arm64, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Each architecture builds natively (no QEMU for the cgo/DuckDB build)
      # and is pushed by digest; the manifest job joins them under the tags.
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*

  manifest:
    needs: image
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: tag multi-arch image
        working-directory: digests
        run: |
          docker buildx imagetools create -t "$IMAGE:$GITHUB_REF_NAME" -t "$IMAGE:latest" \
            $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:$GITHUB_REF_NAME"

  release:
    needs: [binaries, manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: bin-*
          path: dist
          merge-multiple: true
      - name: notes from CHANGELOG
        run: |
          # The section for this version: from its "## [vX.Y.Z]" heading to the next "## ".
          awk -v v="## [${GITHUB_REF_NAME}]" 'index($0, v) == 1 {on=1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for ${GITHUB_REF_NAME}"; exit 1; }
          printf '\n**Image:** `%s:%s` (linux/amd64, linux/arm64)\n' "$IMAGE" "$GITHUB_REF_NAME" >> notes.md
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist && sha256sum *.tar.gz *.zip > SHA256SUMS && cd ..
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.zip dist/SHA256SUMS \
            --title "curral $GITHUB_REF_NAME" --notes-file notes.md
