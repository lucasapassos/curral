name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "needs gofmt:"; echo "$unformatted"; exit 1; fi

      - name: vet
        run: go vet ./... && go vet -tags duckdb_arrow ./...

      # The R2 integration tests skip themselves without R2_* variables.
      # Release builds use -tags duckdb_arrow (Arrow IPC output).
      - name: test
        run: go test -race -count=1 -tags duckdb_arrow ./...

      - name: test without arrow
        run: go test -count=1 ./internal/server ./internal/engine

      - name: build
        run: go build -tags duckdb_arrow -o bin/curral ./cmd/curral && ./bin/curral version

  python-client:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: astral-sh/setup-uv@v6

      - name: seed example databases
        run: |
          mkdir -p data
          uv run --no-project --with duckdb python - <<'PY'
          import duckdb
          c = duckdb.connect("data/sales.duckdb")
          c.execute("CREATE TABLE orders AS SELECT range AS id, (random()*1000)::DECIMAL(10,2) AS amount FROM range(1000000)")
          c.execute("CREATE TABLE salaries(name VARCHAR, value INT)")
          c.close()
          c = duckdb.connect("data/logs.duckdb")
          c.execute("CREATE TABLE events AS SELECT range AS id FROM range(10)")
          c.close()
          PY

      - name: start curral
        run: |
          go build -tags duckdb_arrow -o bin/curral ./cmd/curral
          ./bin/curral serve --catalog examples/catalog.yaml --users examples/users.yaml \
            --policy examples/policy.rego --policy examples/roles.json \
            --policy-limits-query data.curral.limits --auth-ip-max-failures 0 > curral.log 2>&1 &
          for i in $(seq 30); do ./bin/curral healthcheck && exit 0; sleep 1; done
          cat curral.log; exit 1

      - name: test python client
        run: uv run --no-project --with pyarrow --with pytest pytest -q clients/python

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: curral:ci
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: smoke test
        run: docker run --rm curral:ci version
