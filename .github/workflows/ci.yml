name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "needs gofmt:"; echo "$unformatted"; exit 1; fi

      - name: vet
        run: go vet ./... && go vet -tags duckdb_arrow ./...

      # The R2 integration tests skip themselves without R2_* variables.
      # Release builds use -tags duckdb_arrow (Arrow IPC output).
      - name: test
        run: go test -race -count=1 -tags duckdb_arrow ./...

      - name: test without arrow
        run: go test -count=1 ./internal/server ./internal/engine

      - name: build
        run: go build -tags duckdb_arrow -o bin/curral ./cmd/curral && ./bin/curral version

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: curral:ci
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: smoke test
        run: docker run --rm curral:ci version
