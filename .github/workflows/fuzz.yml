name: fuzz

# Differential fuzzing:
# - write-target inspection: fails if a statement changes an object its
#   inspection did not report;
# - row filters/masks: fails if a protected query returns anything other than
#   the same query over a pre-filtered, pre-masked copy of the table.
on:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  workflow_dispatch:
    inputs:
      fuzztime:
        description: "Duration per fuzz target"
        default: "10m"

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [FuzzWriteTargets, FuzzWriteTargetsGrammar, FuzzProtectDifferential]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: fuzz ${{ matrix.target }}
        run: go test ./internal/engine -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime ${{ inputs.fuzztime || '10m' }}

      - name: upload failing input
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-failure-${{ matrix.target }}
          path: internal/engine/testdata/fuzz
